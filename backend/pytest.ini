[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
addopts = -ra --strict-markers

# Our own deprecations are errors. The exemption is FastAPI's, not ours: it
# calls asyncio.iscoroutinefunction, which Python 3.14 deprecates. The image
# runs 3.12, so this only fires for someone testing on a newer interpreter than
# production uses — a reason to scope the ignore, not to drop the rule.
filterwarnings =
    error::DeprecationWarning
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
