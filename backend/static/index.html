<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alena-server</title>
<meta name="color-scheme" content="light dark">
<!-- Inline so it costs no request, and so it cannot collide with /icon.svg,
     which this gateway routes to LumaIndex. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f4e'/%3E%3Cpath d='M8 16h4l3-6 4 12 3-6h2' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#services">Skip to services</a>

<header class="masthead">
  <h1>alena-server</h1>
  <p class="origin" id="origin">loading…</p>
</header>

<main>
  <h2 class="sr-only">Service status</h2>

  <!-- aria-busy while loading; the list itself is polite-live so a service
       going down is announced without stealing focus from whatever the reader
       is doing. -->
  <ul id="services" class="services" aria-live="polite" aria-busy="true">
    <li class="loading">Checking services…</li>
  </ul>
</main>

<footer class="footer">
  <p id="summary" role="status">Loading…</p>
  <p class="meta">
    <span id="gateway-meta"></span>
    <button type="button" id="refresh" class="refresh">Refresh now</button>
  </p>
</footer>

<template id="service-template">
  <li class="service">
    <article>
      <p class="status"><span class="dot" aria-hidden="true"></span><span class="status-text"></span></p>
      <h3 class="name"><a class="name-link"></a></h3>
      <p class="blurb"></p>
      <dl class="facts"></dl>
    </article>
  </li>
</template>

<script src="app.js" defer></script>
</body>
</html>
