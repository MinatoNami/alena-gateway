# Common upstream headers for every proxied location in the gateway.
#
# Included rather than inherited: nginx's `proxy_set_header` does not merge
# across levels — a location that declares even one header drops every header
# declared at server level. Inheriting these would work right up until a
# location needed one extra header, and then silently stop.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# Single entry, and not $proxy_add_x_forwarded_for, which appends. Every app
# behind this gateway reads the first entry of X-Forwarded-For to identify the
# client; appending would put whatever the caller sent in that position, which
# turns a login rate limit into a header the attacker chooses.
#
# $remote_addr is trustworthy here because of the real_ip block in the server:
# it has already been resolved to the tailnet address of the actual client.
proxy_set_header X-Forwarded-For   $remote_addr;

# `tailscale serve` terminates TLS, so the scheme it saw is the true one. It is
# always https — the serve listener has no plaintext mode — but reading it back
# rather than hardcoding means this stays correct if that ever changes.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;

# Websockets. Nuxt's SSR apps do not need this in production today, but an
# upgrade request that loses these headers fails in a way that looks like an
# application bug rather than a proxy one.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 10s;
