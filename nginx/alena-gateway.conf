# ==============================================================================
# alena-gateway — the single front door for one tailnet origin
# ==============================================================================
#
#   tailscale serve :443  ──TLS──>  127.0.0.1:8088  (this server block)
#
# TLS is terminated by `tailscale serve`, which holds a real certificate for the
# MagicDNS name. This block therefore listens in plaintext, on loopback only:
# tailscaled is the sole thing that can connect to it, so nothing here is
# reachable from the LAN or the internet even though the host has a routable
# address.
#
# Route table — the whole contract in one place:
#
#   /                     status page            -> gateway status svc :8090
#   /api/*                status JSON            -> gateway status svc :8090
#   /v1/*                 health API (mobile)    -> health-app Django   :8081
#   /healthz              health liveness        -> health-app Django   :8081
#   /admin/*              health Django admin    -> health-app Django   :8081
#   /static/*             health admin assets    -> health-app Django   :8081
#   /health-app/*         health dashboard       -> /var/www/health-dashboard
#   /health-app/v1/*      health API (prefixed)  -> health-app Django   :8081
#   /athena/*             Athena dashboard       -> athena-web          :8099
#   /luma-index/*         LumaIndex              -> lumaindex-caddy     :8080
#
# Anything at the root that is not listed above belongs to the status page.
# Before adding a root-level path, check services.yaml. The four reserved by
# health-app are there because its Django must believe it owns the origin root:
# the shipped iOS build has /v1 compiled in, and a Django instance gets one
# script name for all of its routes or none.
# ==============================================================================

# Websocket upgrade. Defined here because this is the only site on the host; if
# a second one is ever added, move this to conf.d/ so both can include it
# instead of colliding on a duplicate map.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8088;
    listen [::1]:8088;

    # tailscale serve passes the Host through unchanged. Accepting anything is
    # safe on a loopback listener with exactly one client, and it means the
    # gateway keeps working if the tailnet name ever changes.
    server_name _;

    # --- Client identity -----------------------------------------------------
    #
    # Without this, $remote_addr is 127.0.0.1 for every request — tailscaled —
    # and every downstream rate limit degenerates into one shared bucket.
    #
    # real_ip_recursive is left off deliberately. With it off nginx takes the
    # LAST entry of X-Forwarded-For, which is the address tailscaled itself
    # recorded for the peer. That is correct whether tailscaled overwrites the
    # header or appends to it — a client that sends its own X-Forwarded-For can
    # only ever prepend to the value tailscaled writes, never displace it.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive off;

    # --- Defaults ------------------------------------------------------------
    #
    # Relative redirects. nginx builds an absolute Location from the scheme and
    # port it is itself listening on, which here is plaintext :8088 — an address
    # that exists only inside this host. Every 301 below would have sent the
    # browser somewhere it cannot reach. Relative Location headers let the
    # client keep the origin it already has, which is the one tailscale serves.
    absolute_redirect off;

    client_max_body_size 1m;
    access_log /var/log/nginx/alena-gateway.access.log;
    error_log  /var/log/nginx/alena-gateway.error.log;

    # Applied to responses this server generates itself. Proxied responses keep
    # whatever their application sets — Athena in particular ships a strict CSP
    # of its own, and overwriting it here would weaken it.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    server_tokens off;

    # ==========================================================================
    # health-app — Health Exporter
    # ==========================================================================
    #
    # The iOS app has https://<origin>/v1/health/batches compiled into shipped
    # builds. This prefix cannot move to /health-app/v1 without stranding every
    # phone already syncing, so it stays at the root and is reserved in
    # services.yaml. The dashboard's own JS also calls /v1/* root-absolute, so
    # it keeps working from under /health-app/ unchanged.
    location ^~ /v1/ {
        include snippets/alena-gateway-proxy.conf;
        proxy_pass http://127.0.0.1:8081;

        # A first sync ships 5,000 records in one batch.
        client_max_body_size 64m;
        # Spool a slow phone upload to disk rather than streaming it straight
        # into a gunicorn worker and holding that worker for the whole upload.
        client_body_buffer_size 1m;
        client_body_timeout 120s;

        # Matches gunicorn's own timeout, so nginx does not hang up on a worker
        # still committing a large batch, or on a CSV export mid-stream.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # Exports stream deliberately (the view sends X-Accel-Buffering: no).
        # Capping the temp file at 0 stops nginx swallowing hundreds of
        # megabytes before the client sees its first byte.
        proxy_buffering on;
        proxy_max_temp_file_size 0;
    }

    # Unauthenticated liveness, used by the container healthcheck and by
    # health-app's own deploy verification.
    location = /healthz {
        include snippets/alena-gateway-proxy.conf;
        proxy_pass http://127.0.0.1:8081;
    }

    # Django admin, and the whitenoise-served CSS and JS behind it.
    #
    # These stay at the root rather than moving under /health-app because
    # health-app's Django has to believe it lives at the origin root: /v1 cannot
    # move, and FORCE_SCRIPT_NAME is instance-wide, so there is no way to give
    # the admin a prefix without giving the ingest endpoint one too.
    location ^~ /admin/ {
        include snippets/alena-gateway-proxy.conf;
        proxy_pass http://127.0.0.1:8081;
        proxy_read_timeout 120s;
    }

    location ^~ /static/ {
        include snippets/alena-gateway-proxy.conf;
        proxy_pass http://127.0.0.1:8081;
        proxy_read_timeout 60s;
    }

    # The same API under the service's prefix. Nothing uses this yet: it exists
    # so a future build of the iOS app can move to /health-app/v1/* and the two
    # can run side by side while old installs drain.
    location ^~ /health-app/v1/ {
        include snippets/alena-gateway-proxy.conf;
        # Trailing /v1/ on the upstream strips the /health-app prefix, so Django
        # sees exactly the URLs it already routes.
        proxy_pass http://127.0.0.1:8081/v1/;

        client_max_body_size 64m;
        client_body_buffer_size 1m;
        client_body_timeout 120s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
    }

    # Vite fingerprints these filenames, so they can be cached hard. Declared
    # with ^~ so it beats the app-shell location below on prefix length.
    location ^~ /health-app/assets/ {
        alias /var/www/health-dashboard/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The dashboard is a static SPA on disk — no upstream, and no reason to
    # spend a Python worker on files that do not change between deploys.
    location ^~ /health-app/ {
        alias /var/www/health-dashboard/;
        # Client-side routing: unknown paths fall back to the shell rather than
        # 404ing. The fallback is a URI, so it re-enters this location.
        try_files $uri $uri/ /health-app/index.html;
        # Never cache the shell, or a deploy serves a stale index that still
        # references the previous build's fingerprinted assets.
        add_header Cache-Control "no-cache";
    }
    location = /health-app { return 301 /health-app/; }

    # Where the dashboard lived when health-app owned the origin on its own.
    location = /dashboard  { return 301 /health-app/; }
    location ^~ /dashboard/ { return 301 /health-app/; }

    # ==========================================================================
    # athena — Athena
    # ==========================================================================
    #
    # The prefix is passed through untouched: the Nuxt app is told its own base
    # path via NUXT_APP_BASE_URL, so it both expects /athena/* on the way in and
    # writes /athena/* into the HTML it renders. Stripping the prefix here would
    # leave it emitting asset URLs for a path this gateway does not serve.

    # Server-sent events. Buffering holds them until the buffer fills, so the
    # page silently stops updating instead of visibly breaking — declared first
    # and with ^~ so it cannot be captured by the app-shell location.
    location ^~ /athena/api/events {
        include snippets/alena-gateway-proxy.conf;
        proxy_pass http://127.0.0.1:8099;

        proxy_buffering off;
        proxy_cache off;
        # The stream is idle between events. nginx's 60s default would drop the
        # connection during any quiet period.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Some intermediaries honour this even when proxy_buffering is off.
        proxy_set_header X-Accel-Buffering no;
    }

    location ^~ /athena/ {
        include snippets/alena-gateway-proxy.conf;
        proxy_pass http://127.0.0.1:8099;

        # Scan and investigation endpoints do real work inside the request.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /athena { return 301 /athena/; }

    # ==========================================================================
    # luma-index — LumaIndex
    # ==========================================================================
    #
    # Split, because the two halves of LumaIndex want opposite things:
    #
    #   Nuxt  needs the prefix PASSED THROUGH. It is told its base path with
    #         NUXT_APP_BASE_URL, so Nitro answers on /luma-index/* and writes
    #         /luma-index/* into the HTML it renders.
    #
    #   Django needs the prefix STRIPPED. FORCE_SCRIPT_NAME only changes the
    #         URLs Django *builds*; it does not change the path it *routes*, so
    #         a request still has to arrive as /api/... or the URLconf 404s. The
    #         two together mean Django matches the real route and still emits
    #         prefixed links in DRF pagination and the admin.
    #
    # LumaIndex's own Caddy sits between this and both of them, and needs no
    # changes: it sees exactly the paths it saw when it owned the origin.

    location ^~ /luma-index/api/ {
        include snippets/alena-gateway-proxy.conf;
        # Trailing /api/ replaces the matched prefix, so Caddy and Django see
        # /api/... — do not remove it.
        proxy_pass http://127.0.0.1:8080/api/;

        # A single PDF may be up to LUMA_MAX_UPLOAD_BYTES (2 GiB by default).
        client_max_body_size 2g;
        # Stream the upload through rather than spooling 2 GiB onto this host's
        # disk first. Safe because LumaIndex runs gthread workers, where a slow
        # client occupies a thread rather than a whole process.
        proxy_request_buffering off;
        # Books stream out through Django's authorization boundary; buffering
        # would defeat that and stall the first byte.
        proxy_buffering off;
        # Matches the read timeout Caddy already applies to this route.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /luma-index/admin/ {
        include snippets/alena-gateway-proxy.conf;
        proxy_pass http://127.0.0.1:8080/admin/;
        proxy_read_timeout 120s;
    }

    # Django admin's own CSS and JS, served by whitenoise. STATIC_URL is built
    # from LUMA_BASE_PATH so the admin asks for them here rather than at /static.
    location ^~ /luma-index/static/ {
        include snippets/alena-gateway-proxy.conf;
        proxy_pass http://127.0.0.1:8080/static/;
        proxy_read_timeout 60s;
    }

    # Everything else is Nuxt, prefix intact.
    location ^~ /luma-index/ {
        include snippets/alena-gateway-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /luma-index { return 301 /luma-index/; }

    # LumaIndex writes its favicon links into the document head as root-absolute
    # paths, and Nuxt does not rewrite those from the base path the way it
    # rewrites build assets. Redirecting is enough — no other app on this origin
    # claims these names, and the status page carries its icon inline.
    #
    # /manifest.webmanifest is deliberately NOT redirected. It would resolve,
    # but its start_url is baked at build time and still reads "/", so
    # installing the PWA would launch the status page instead of the library. No
    # manifest disables the install prompt honestly. See README, Known edges.
    location = /icon.svg             { return 301 /luma-index/icon.svg; }
    location = /favicon-32.png       { return 301 /luma-index/favicon-32.png; }
    location = /apple-touch-icon.png { return 301 /luma-index/apple-touch-icon.png; }

    # ==========================================================================
    # The gateway's own status page
    # ==========================================================================
    #
    # Last, and as a bare prefix, so every route above wins on specificity. This
    # is the catch-all: an unknown path renders the status page rather than a
    # bare nginx 404, which is the more useful answer to "I mistyped the URL".
    location / {
        include snippets/alena-gateway-proxy.conf;
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 30s;
    }
}
